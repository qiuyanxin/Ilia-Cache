<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/interface.css"><style>body{display:grid;place-items:center;min-height:100vh;padding:32px;background:var(--paper)}#preview-stage{width:min(360px,100%)}.file-drop-zone{min-height:210px}.file-drop-zone .drop-sub{display:none}.t-reel{font-size:64px}#counter-action{display:block;margin:24px auto 0;padding:10px 20px;border-radius:12px;background:var(--raised)}.spring-select{width:100%}</style><div id="preview-stage"></div><script type="module">
import {mountFileDrop,decorateDropdowns} from '/native-controls.mjs';import {renderCounter} from '/counter.mjs';const host=document.querySelector('#preview-stage'),kind=new URL(location.href).searchParams.get('kind');if(kind==='drop'){const input=document.createElement('input');input.type='file';input.multiple=true;input.hidden=true;const zone=document.createElement('div');host.append(zone,input);mountFileDrop(zone,input,()=>{});}else if(kind==='select'){host.innerHTML='<select aria-label="选择组件分类"><option>组件</option><option>设计参考</option><option>网页动效</option></select>';decorateDropdowns();}else{host.innerHTML='<div id="count"></div><button id="counter-action">增加计数</button>';let n=88;renderCounter(document.querySelector('#count'),n);document.querySelector('button').onclick=()=>renderCounter(document.querySelector('#count'),++n);}addEventListener('message',e=>{if(e.data?.type==='motion:theme')document.documentElement.dataset.theme=e.data.theme;});
</script></html>
