<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>卡什 · 动作预览</title>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #f7f7f7; color: #1d1d1f; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { position: absolute; inset: 0 0 auto; padding: 24px clamp(24px, 5vw, 76px); }
    header a { color: inherit; text-decoration: none; font-size: 22px; font-weight: 650; letter-spacing: -.06em; }
    main { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); align-items: center; width: min(100%, 1500px); min-height: 100svh; margin-inline: auto; padding: 84px clamp(24px, 5vw, 76px) 36px; }
    h1 { margin: 0; font-size: clamp(34px, 4.4vw, 68px); font-weight: 650; line-height: 1.14; letter-spacing: -.06em; }
    p { margin: 24px 0 0; color: #656565; line-height: 1.75; font-size: 15px; }
    .touch-hint { display: none; }
    .stage { position: relative; width: min(100%, 54svh, 570px); margin-inline: auto; isolation: isolate; }
    .deer { width: 100%; aspect-ratio: 512 / 738; display: block; position: relative; padding: 0; border: 0; border-radius: 32px; isolation: isolate; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .deer:focus-visible { outline: 2px solid #656565; outline-offset: 6px; }
    .pose { position: absolute; inset: 0; pointer-events: none; background: url('./cache-deer-motion-poses-candy.webp') no-repeat; background-size: 300% 100%; mix-blend-mode: plus-lighter; mask-image: linear-gradient(#000 94%, transparent); }
    .pose:nth-child(2) { background-position: 50% 50%; }
    .pose:nth-child(3) { background-position: 100% 50%; }
    @media (hover: none) { .pointer-hint { display: none; } .touch-hint { display: inline; } }
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; align-content: center; gap: 12px; padding-top: 64px; }
      .stage { grid-row: 1; width: min(100%, 38svh, 380px); }
      p { margin-top: 14px; }
    }
  </style>
</head>
<body>
  <header><a href="./">Cache</a></header>
  <main>
    <section aria-labelledby="title">
      <h1 id="title">把灵感捡回来，<br>把作品做出来。</h1>
      <p><span class="pointer-hint">把鼠标移到卡什身上。</span><span class="touch-hint">点一下卡什。</span></p>
    </section>
    <div class="stage">
      <button class="deer" type="button" aria-label="看看小鹿卡什的反应" data-pose="reach">
        <span class="pose" aria-hidden="true"></span>
        <span class="pose" aria-hidden="true" style="opacity: 0"></span>
        <span class="pose" aria-hidden="true" style="opacity: 0"></span>
      </button>
    </div>
  </main>
  <script type="module" src="./cache-deer-motion-preview.mjs"></script>
</body>
</html>
