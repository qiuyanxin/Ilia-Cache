<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f4f4f4;color:#222}body{display:grid;place-items:center}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:focus-visible,input:focus-visible{outline:2px solid #888;outline-offset:4px}.demo{width:min(380px,86vw)}[data-theme=dark] body{background:#181818;color:#eee}[data-theme=dark] .panel,[data-theme=dark] .field{background:#282828}.panel{background:white;border-radius:18px;overflow:hidden}header{height:48px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #8882}#back{position:absolute;left:14px;font-size:24px;opacity:0}#page{padding:12px}#page>button{display:flex;justify-content:space-between;width:100%;padding:14px;border-radius:10px}#page>button:hover{background:#8881}</style></head><body><div class="demo panel"><header><button id="back" aria-label="返回">‹</button><b id="title">设置</b></header><div id="page"><button data-page="备份">备份 <span>›</span></button><button data-page="外观">外观 <span>›</span></button></div></div><script>// DesignBookmark's spring integrator: four substeps, capped at 1/30s.
// Values below retain the source stiffness, damping and mass.
const MOTION={sidebar:[260,24],label:[300,26],highlight:[380,28],rollLink:[380,24],wordWidth:[320,30],wordLetter:[420,26],commandOpen:[300,28],commandPress:[520,34,.6],copyRoll:[260,20],copyIcon:[420,18],copyWidth:[300,24],barLabel:[300,26],barHighlight:[340,28],barIcon:[520,14]};
const active=new Set();let frame=0,last=0;const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now){const dt=Math.min((now-last)/1000,1/30);last=now;for(const s of active){for(let i=0;i<4;i++){const a=(-s.k*(s.x-s.t)-s.c*s.v)/s.mass;s.v+=a*dt/4;s.x+=s.v*dt/4;}s.draw(s.x);if(Math.abs(s.x-s.t)<.001&&Math.abs(s.v)<.001){s.x=s.t;s.draw(s.x);active.delete(s);}}frame=active.size?requestAnimationFrame(loop):0;}
function spring(x,preset,draw){const[k,c,mass=1]=preset,s={x,t:x,v:0,k,c,mass,draw,set(t){s.t=t;if(reduced()){s.x=t;s.v=0;draw(t);return;}active.add(s);if(!frame){last=performance.now();frame=requestAnimationFrame(loop);}},jump(x){s.x=x;s.v=0;draw(x);},destroy(){active.delete(s);}};draw(x);return s;}
function delay(seconds,fn){return setTimeout(fn,seconds*1000);}
const page=document.querySelector('#page'),title=document.querySelector('#title'),back=document.querySelector('#back');function show(name){title.textContent=name;back.style.opacity=name==='设置'?0:1;page.innerHTML=name==='设置'?'<button data-page="备份">备份<span>›</span></button><button data-page="外观">外观<span>›</span></button>':name==='备份'?'<button>导出备份</button><button>导入备份</button>':'<button data-theme="light">白色</button><button data-theme="dark">黑色</button>';page.animate([{transform:'translateX('+(name==='设置'?-90:300)+'px)',opacity:.3},{transform:'translateX(0)',opacity:1}],{duration:name==='设置'?340:420,easing:'cubic-bezier(.23,1,.32,1)'});}back.onclick=()=>show('设置');page.onclick=e=>{const b=e.target.closest('button');if(b?.dataset.page)show(b.dataset.page);if(b?.dataset.theme)document.documentElement.dataset.theme=b.dataset.theme;};addEventListener('keydown',e=>{if(e.key==='Escape')show('设置');});;addEventListener('message',e=>{if(e.data?.type==='motion:theme')document.documentElement.dataset.theme=e.data.theme;});</script></body></html>
