<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光谱卡包</title>
<link rel="stylesheet" href="./pack.css">
<script defer src="./pack.js"></script>
</head>
<body>
<header><h1>光谱卡包</h1><button id="sound" type="button" aria-pressed="false">声音</button></header>
<main aria-label="光谱卡包交互">
  <div class="stage">
    <div id="deck" class="deck" hidden></div>
    <div id="burst" class="burst" aria-hidden="true"></div>
    <button id="pack" class="pack" type="button" aria-label="拆开光谱卡包"></button>
  </div>
  <footer>
    <p id="hint">点击卡包，或横向拖动封口</p>
    <button id="again" type="button" hidden>再拆一包</button>
    <p id="status" class="sr-only" role="status"></p>
  </footer>
</main>
<template id="skin">
  <span class="skin">
    <span class="seal"></span>
    <span class="edition">ILIA · OPTICAL STUDIES</span>
    <span class="name">光谱<br>标本</span>
    <span class="print"></span>
    <span class="issue">SERIES 01 <span>5 / PACK</span></span>
  </span>
</template>
</body>
</html>
