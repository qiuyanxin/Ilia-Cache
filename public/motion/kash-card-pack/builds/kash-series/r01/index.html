<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡什盲盒 · 玻璃镭射样卡</title>
<link rel="stylesheet" href="./cards.css">
<link rel="stylesheet" href="./pack.css">
<script type="module" src="./preview.js"></script>
</head>
<body>
<main>
  <header class="heading">
    <p class="edition">ILIA CACHE / 卡什盲盒</p>
    <h1>卡什的镭射收藏</h1>
    <p>移动鼠标看反光。手机轻点卡面，键盘可用左右方向键。</p>
  </header>
  <div class="display">
    <section class="package" aria-label="包装样稿">
      <button class="wrapper" type="button" aria-label="包装正面，点击看背面" aria-pressed="false">
        <span class="wrap-face wrap-front" aria-hidden="true">
          <span class="seam top"></span>
          <span class="wrap-brand">ILIA CACHE</span>
          <span class="wrap-title">卡什<br>盲盒</span>
          <span class="wrap-mark"><i></i><i></i><i></i></span>
          <span class="wrap-series">玻璃镭射系列</span>
          <span class="wrap-spec">SERIES 01 <span>3 张 / 包</span></span>
          <span class="seam bottom"></span>
        </span>
        <span class="wrap-face wrap-back" aria-hidden="true">
          <span class="seam top"></span>
          <span class="wrap-brand">ILIA CACHE</span>
          <span class="wrap-story">我给你<br>留了一张。</span>
          <span class="wrap-inventory">摄影师 · 画家 · 代码<br>导演 · 芭蕾 · 蓝条纹睡衣<br>隐藏款 · 天使小鹿</span>
          <span class="wrap-spec">SERIES 01 <span>3 张 / 包</span></span>
          <span class="seam bottom"></span>
        </span>
      </button>
      <p>包装样稿 · 点击翻面</p>
    </section>
    <section class="samples" aria-label="三张镭射样卡"></section>
  </div>
</main>
<template id="sample">
  <article class="sample">
    <button class="card" type="button">
      <span class="card-plane">
        <span class="glass-base"></span>
        <span class="portrait-window">
          <span class="foil"></span>
          <span class="foil-pattern"></span>
        </span>
        <span class="contact-shadow"></span>
        <img class="mascot" alt="" draggable="false" width="768" height="1024">
        <span class="card-type">CACHE / 01</span>
        <span class="card-copy"><strong></strong><small></small></span>
        <span class="card-number"></span>
        <span class="glass-coat"></span>
        <span class="glass-rim"></span>
      </span>
    </button>
    <p class="finish-label"></p>
  </article>
</template>
</body>
</html>
