<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f4f4f4;color:#222}body{display:grid;place-items:center}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:focus-visible,input:focus-visible{outline:2px solid #888;outline-offset:4px}.demo{width:min(380px,86vw)}[data-theme=dark] body{background:#181818;color:#eee}[data-theme=dark] .panel,[data-theme=dark] .field{background:#282828}.field{position:relative;width:150px;height:44px;border-radius:14px;background:#e5e5e5;overflow:hidden}#open{height:44px;width:150px;text-align:left;padding:0 16px}small{margin-left:18px;color:#888}input{position:absolute;inset:0;width:100%;border:0;background:none;padding:0 16px;opacity:0;pointer-events:none}.field.open input{opacity:1;pointer-events:auto}.field.open button{opacity:0}</style></head><body><div class="demo"><div class="field"><button id="open">搜索灵感 <small>⌘ K</small></button><input id="q" placeholder="搜索收藏" aria-label="搜索收藏"></div></div><script>// DesignBookmark's spring integrator: four substeps, capped at 1/30s.
// Values below retain the source stiffness, damping and mass.
const MOTION={sidebar:[260,24],label:[300,26],highlight:[380,28],rollLink:[380,24],wordWidth:[320,30],wordLetter:[420,26],commandOpen:[300,28],commandPress:[520,34,.6],copyRoll:[260,20],copyIcon:[420,18],copyWidth:[300,24],barLabel:[300,26],barHighlight:[340,28],barIcon:[520,14]};
const active=new Set();let frame=0,last=0;const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now){const dt=Math.min((now-last)/1000,1/30);last=now;for(const s of active){for(let i=0;i<4;i++){const a=(-s.k*(s.x-s.t)-s.c*s.v)/s.mass;s.v+=a*dt/4;s.x+=s.v*dt/4;}s.draw(s.x);if(Math.abs(s.x-s.t)<.001&&Math.abs(s.v)<.001){s.x=s.t;s.draw(s.x);active.delete(s);}}frame=active.size?requestAnimationFrame(loop):0;}
function spring(x,preset,draw){const[k,c,mass=1]=preset,s={x,t:x,v:0,k,c,mass,draw,set(t){s.t=t;if(reduced()){s.x=t;s.v=0;draw(t);return;}active.add(s);if(!frame){last=performance.now();frame=requestAnimationFrame(loop);}},jump(x){s.x=x;s.v=0;draw(x);},destroy(){active.delete(s);}};draw(x);return s;}
function delay(seconds,fn){return setTimeout(fn,seconds*1000);}
const field=document.querySelector('.field'),input=document.querySelector('input'),W=spring(150,MOTION.commandOpen,x=>field.style.width=x+'px'),P=spring(1,MOTION.commandPress,x=>field.style.transform='scale('+x+')');const open=()=>{field.classList.add('open');W.set(Math.min(380,innerWidth*.86));input.focus();};document.querySelector('button').onclick=open;field.onpointerdown=()=>P.set(.97);field.onpointerup=()=>P.set(1);input.onkeydown=e=>{if(e.key==='Escape'){input.value='';field.classList.remove('open');W.set(150);document.querySelector('button').focus();}};addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();open();}});;addEventListener('message',e=>{if(e.data?.type==='motion:theme')document.documentElement.dataset.theme=e.data.theme;});</script></body></html>
